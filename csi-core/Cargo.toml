[package]
name = "csi-core"
version = "0.1.0"
edition = "2021"
description = "Shared cryptographic and broker logic for the BlueHash Windows agent"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

# Windows secure-storage: CredWriteW / CredReadW via the official Microsoft
# `windows` crate. On macOS this slot was held by `security-framework` +
# `core-foundation`. We deliberately avoid the cross-platform `keyring`
# crate so the security model (LocalMachine persistence, encrypted at
# rest by DPAPI) is explicit in the code rather than abstracted away.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
] }
