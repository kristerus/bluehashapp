[package]
name = "csi-tray"
version = "0.1.0"
edition = "2021"
description = "BlueHash desktop tray app (Windows)"

[dependencies]
anyhow = "1.0.102"
csi-ipc = { version = "0.1.0", path = "../csi-ipc" }
serde_json = "1.0.149"
# Tauri 1.6 mirrors the macOS version's pinned major. `macos-private-api`
# is dropped — it doesn't apply on Windows.
tauri = { version = "1.6", features = ["api-all", "system-tray"] }
tokio = { version = "1.52.3", features = ["net", "io-util", "time"] }

# Tauri 1.x flips between dev (serves assets from devPath) and bundle
# (serves assets via custom-protocol from the embedded distDir) based
# on this feature flag. `cargo tauri build` enables `custom-protocol`
# implicitly; `cargo run` leaves it disabled.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1", features = [] }
# build.rs rasterizes `icons/source.svg` (the BlueHash key glyph) into
# `icons/icon.ico` (multi-size, embedded into the .exe resource section)
# and `icons/icon.png` (the tray glyph). If source.svg is absent it falls
# back to a solid-blue placeholder.
ico = "0.4"
png = "0.17"
resvg = "0.42"
tiny-skia = "0.11"
usvg = "0.42"
